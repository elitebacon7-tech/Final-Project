<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Between the Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" role="main" aria-label="Interactive Jazz Website">
    <h1 id="headline" class="headline perfection">EVERY NOTE IN ITS PLACE.</h1>
    <div class="staff" aria-hidden="true">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <ul class="notes" aria-label="Musical Notes">
      <li class="note" aria-hidden="true" style="--index:0;">&#9835;</li>
      <li class="note" aria-hidden="true" style="--index:1;">&#9835;</li>
      <li class="note" aria-hidden="true" style="--index:2;">&#9835;</li>
      <li class="note" aria-hidden="true" style="--index:3;">&#9835;</li>
      <li class="note" aria-hidden="true" style="--index:4;">&#9835;</li>
    </ul>
    <p id="description" class="description perfection">Order. Precision. Repetition.</p>
    <button id="toggleBtn" class="btn" aria-pressed="false">BREAK THE RULES.</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
